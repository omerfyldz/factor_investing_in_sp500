name: Trend Following Backtest

# Runs the Faber GTAA backtest in Actions (this is where the network can reach
# Yahoo Finance) and commits the results table, NAV curves, equity-curve PNG and
# robustness sweep back into trend_following/results/.
on:
  workflow_dispatch:
    inputs:
      cost_bps:
        description: 'Transaction cost in basis points per side'
        required: false
        default: '5'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r trend_following/requirements.txt

      - name: Run unit tests (look-ahead + core invariants)
        working-directory: trend_following
        run: |
          python tests/test_core.py
          python tests/test_lookahead.py

      - name: Run backtest + robustness sweep
        working-directory: trend_following
        run: |
          python -m backtest.run_backtest --force-download --cost-bps "${{ github.event.inputs.cost_bps || '5' }}"
          python -m backtest.robustness

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trend_following/results/ trend_following/data/prices.csv
          git diff --staged --quiet || git commit -m "chore: trend backtest results $(date +%Y-%m-%d)"
          git push
